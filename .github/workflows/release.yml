name: Release

# Driven by semantic version labels on a PR (major/minor/patch) or a manual
# dispatch. Computes the next semver from the latest `v*` tag and creates a
# GitHub Release. Release notes are auto-generated from the Conventional Commits
# since the previous tag. Pushing the new tag triggers `build.yml`, which attaches
# the Docker image and standalone binaries to the release.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'major') ||
      contains(github.event.pull_request.labels.*.name, 'minor') ||
      contains(github.event.pull_request.labels.*.name, 'patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
          else
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if echo "$labels" | grep -qx major; then type=major
            elif echo "$labels" | grep -qx minor; then type=minor
            else type=patch; fi
            echo "type=$type" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          latest="${latest#v}"
          IFS='.' read -r maj min pat <<< "$latest"
          maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
          case "${{ steps.type.outputs.type }}" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
          esac
          echo "version=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"
          echo "Next version: v$maj.$min.$pat"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Automated release cut from Conventional Commits. The changelog below is
            generated from the commits since the previous tag.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
