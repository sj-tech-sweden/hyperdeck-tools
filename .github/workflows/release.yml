name: Release

# Driven by semantic version labels on a merged PR (major/minor/patch) or a
# manual dispatch. Computes the next semver from the latest `v*` tag, builds a
# changelog from the Conventional Commits since the previous tag (grouped into
# Features / Bug Fixes / Dependencies / Other, matching the stockwire-rental
# style), creates the GitHub Release, and then builds + attaches the Docker image
# and standalone macOS/Windows binaries in the same run (chained via `needs`).

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          contains(github.event.pull_request.labels.*.name, 'major') ||
          contains(github.event.pull_request.labels.*.name, 'minor') ||
          contains(github.event.pull_request.labels.*.name, 'patch')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.set_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
          else
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if echo "$labels" | grep -qx major; then type=major
            elif echo "$labels" | grep -qx minor; then type=minor
            else type=patch; fi
            echo "type=$type" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          latest="${latest#v}"
          IFS='.' read -r maj min pat <<< "$latest"
          maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
          case "${{ steps.type.outputs.type }}" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
          esac
          echo "version=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"
          echo "Next version: v$maj.$min.$pat"

      - name: Set release SHA
        id: set_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate conventional-commits changelog
        id: changelog
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          LATEST=$(git describe --tags --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || echo "0.0.0")
          if [ "$LATEST" = "0.0.0" ]; then
            RANGE="$RELEASE_SHA"
            COMMITS=$(git log --pretty=format:'%s|||%h' -n 50 "$RELEASE_SHA")
          else
            RANGE="${LATEST}..${RELEASE_SHA}"
            COMMITS=$(git log --pretty=format:'%s|||%h' "$RANGE")
          fi

          FEATURES=""; FIXES=""; BREAKING=""; OTHER=""; DEPS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line%%|||*}"
            SHA="${line##*|||}"
            entry="- ${MSG} (\`${SHA}\`)"
            if echo "$MSG" | grep -qiE '^feat(\(|:)|^[a-z]+(\(|:).*\bfeat'; then
              FEATURES+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^fix(\(|:)|^[a-z]+(\(|:).*\bfix'; then
              FIXES+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^breaking|^BREAKING'; then
              BREAKING+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^Update |^Bump |^Pin |^(chore|build|fix)\(deps'; then
              DEPS+="${entry}"$'\n'
            else
              OTHER+="${entry}"$'\n'
            fi
          done <<< "$COMMITS"

          NOTES_FILE="$(mktemp)"
          {
            if [ "${{ steps.type.outputs.type }}" = "major" ]; then
              echo "## ⚠️ Breaking Changes"
              echo ""
            fi
            [ -n "$BREAKING" ] && printf '%s\n' "$BREAKING"
            if [ -n "$FEATURES" ]; then echo "## ✨ Features"; echo ""; printf '%s\n' "$FEATURES"; fi
            if [ -n "$FIXES" ]; then echo "## 🐛 Bug Fixes"; echo ""; printf '%s\n' "$FIXES"; fi
            if [ -n "$DEPS" ]; then echo "## ⬆️ Dependencies"; echo ""; printf '%s\n' "$DEPS"; fi
            if [ -n "$OTHER" ]; then echo "## 📦 Other Changes"; echo ""; printf '%s\n' "$OTHER"; fi
            if [ -z "$BREAKING$FEATURES$FIXES$DEPS$OTHER" ]; then echo "No notable changes"; fi
          } > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          NOTES="${{ steps.changelog.outputs.notes_file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          fi

  # ── Docker image → GHCR (multi-arch: amd64 + arm64) ──────────────────
  docker:
    name: Docker
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS standalone binary ──────────────────────────────────────────
  macos:
    name: macOS
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name hyperdeck-tools --add-data "app/frontend:app/frontend" --add-data "app/backend/plugins:app/backend/plugins" --add-data "app/backend/model_capability_profiles.json:app/backend" run.py

      - name: Package macOS artifact
        run: |
          ARCH="$(uname -m)"
          cp "dist/hyperdeck-tools" "dist/hyperdeck-tools-macos-${ARCH}"
          (cd dist && zip -j "hyperdeck-tools-macos-${ARCH}.zip" "hyperdeck-tools-macos-${ARCH}")

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/hyperdeck-tools-macos-*.zip

  # ── Windows standalone binary ────────────────────────────────────────
  windows:
    name: Windows
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name hyperdeck-tools.exe --add-data "app/frontend;app/frontend" --add-data "app/backend/plugins;app/backend/plugins" --add-data "app/backend/model_capability_profiles.json;app/backend" run.py

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/hyperdeck-tools.exe
