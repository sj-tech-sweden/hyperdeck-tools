name: Release

# Driven by semantic version labels on a merged PR (major/minor/patch) or a
# manual dispatch. Computes the next semver from the latest `v*` tag and creates
# a GitHub Release. Release notes are generated from the Conventional Commits
# since the previous tag and grouped by type (Features / Bug Fixes /
# Dependencies / Other), matching the stockwire-rental release-note style.
# Pushing the new tag triggers `build.yml`, which attaches the Docker image and
# standalone binaries to the release.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          contains(github.event.pull_request.labels.*.name, 'major') ||
          contains(github.event.pull_request.labels.*.name, 'minor') ||
          contains(github.event.pull_request.labels.*.name, 'patch')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
          else
            labels=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if echo "$labels" | grep -qx major; then type=major
            elif echo "$labels" | grep -qx minor; then type=minor
            else type=patch; fi
            echo "type=$type" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          latest="${latest#v}"
          IFS='.' read -r maj min pat <<< "$latest"
          maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
          case "${{ steps.type.outputs.type }}" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
          esac
          echo "version=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"
          echo "Next version: v$maj.$min.$pat"

      - name: Generate conventional-commits changelog
        id: changelog
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          LATEST=$(git describe --tags --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || echo "0.0.0")
          if [ "$LATEST" = "0.0.0" ]; then
            RANGE="$RELEASE_SHA"
            COMMITS=$(git log --pretty=format:'%s|||%h' -n 50 "$RELEASE_SHA")
          else
            RANGE="${LATEST}..${RELEASE_SHA}"
            COMMITS=$(git log --pretty=format:'%s|||%h' "$RANGE")
          fi

          FEATURES=""; FIXES=""; BREAKING=""; OTHER=""; DEPS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line%%|||*}"
            SHA="${line##*|||}"
            entry="- ${MSG} (\`${SHA}\`)"
            if echo "$MSG" | grep -qiE '^feat(\(|:)|^[a-z]+(\(|:).*\bfeat'; then
              FEATURES+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^fix(\(|:)|^[a-z]+(\(|:).*\bfix'; then
              FIXES+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^breaking|^BREAKING'; then
              BREAKING+="${entry}"$'\n'
            elif echo "$MSG" | grep -qiE '^Update |^Bump |^Pin |^(chore|build|fix)\(deps'; then
              DEPS+="${entry}"$'\n'
            else
              OTHER+="${entry}"$'\n'
            fi
          done <<< "$COMMITS"

          NOTES_FILE="$(mktemp)"
          {
            if [ "${{ steps.type.outputs.type }}" = "major" ]; then
              echo "## ⚠️ Breaking Changes"
              echo ""
            fi
            [ -n "$BREAKING" ] && printf '%s\n' "$BREAKING"
            if [ -n "$FEATURES" ]; then echo "## ✨ Features"; echo ""; printf '%s\n' "$FEATURES"; fi
            if [ -n "$FIXES" ]; then echo "## 🐛 Bug Fixes"; echo ""; printf '%s\n' "$FIXES"; fi
            if [ -n "$DEPS" ]; then echo "## ⬆️ Dependencies"; echo ""; printf '%s\n' "$DEPS"; fi
            if [ -n "$OTHER" ]; then echo "## 📦 Other Changes"; echo ""; printf '%s\n' "$OTHER"; fi
            if [ -z "$BREAKING$FEATURES$FIXES$DEPS$OTHER" ]; then echo "No notable changes"; fi
          } > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          NOTES="${{ steps.changelog.outputs.notes_file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --target "$(git rev-parse HEAD)"
          fi
