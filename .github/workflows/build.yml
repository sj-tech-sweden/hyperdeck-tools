name: Build Release Assets

# Triggered when release-please publishes a GitHub Release. Builds and attaches
# the Docker image (multi-arch) and the standalone macOS / Windows binaries.

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # ── Docker image → GHCR (multi-arch: amd64 + arm64) ──────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── macOS standalone binary ──────────────────────────────────────────
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name hyperdeck-tools --add-data "app/frontend:app/frontend" --add-data "app/backend/plugins:app/backend/plugins" --add-data "app/backend/model_capability_profiles.json:app/backend" run.py

      - name: Package macOS artifact
        run: |
          ARCH="$(uname -m)"
          cp "dist/hyperdeck-tools" "dist/hyperdeck-tools-macos-${ARCH}"
          (cd dist && zip -j "hyperdeck-tools-macos-${ARCH}.zip" "hyperdeck-tools-macos-${ARCH}")

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/hyperdeck-tools-macos-*.zip

  # ── Windows standalone binary ────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name hyperdeck-tools.exe --add-data "app/frontend;app/frontend" --add-data "app/backend/plugins;app/backend/plugins" --add-data "app/backend/model_capability_profiles.json;app/backend" run.py

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/hyperdeck-tools.exe
